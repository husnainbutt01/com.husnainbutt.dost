name: Build DOST Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure Android SDK & Licenses
        run: |
          ANDROID_SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK" >> "$GITHUB_ENV"
          mkdir -p "$ANDROID_SDK/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e" >> "$ANDROID_SDK/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b84351f2910" >> "$ANDROID_SDK/licenses/android-sdk-preview-license"
          ls -la "$ANDROID_SDK/platforms" || true

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps

      - name: Verify TypeScript & Build production web bundle
        run: |
          npm run lint
          npm run build

      - name: Sync web bundle & plugins into Android project
        run: npx cap sync android

      - name: Build Debug APK (Installable on Android phones)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare downloadable APK artifact
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk DOST-Messaging-App.apk
          ls -lh DOST-Messaging-App.apk

      - name: Upload DOST-Messaging-App.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DOST-Messaging-App-APK
          path: DOST-Messaging-App.apk
          retention-days: 30
