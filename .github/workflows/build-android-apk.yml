name: Build DOST Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install npm dependencies
        run: npm install

      - name: Build production web bundle
        run: npm run build

      - name: Sync web bundle & plugins into Android project
        run: npx cap sync android

      - name: Grant Gradle Wrapper execute permission
        run: chmod +x android/gradlew

      - name: Build Debug APK (Installable on Android phones)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare downloadable APK artifact
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk DOST-Messaging-App.apk
          ls -lh DOST-Messaging-App.apk

      - name: Upload DOST-Messaging-App.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DOST-Messaging-App-APK
          path: DOST-Messaging-App.apk
          retention-days: 30
